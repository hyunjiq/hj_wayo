<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="//cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <script src="//cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>  
    <title>Document</title>
    <style>
        .wrap{
            padding-right: 0 ;
            padding-left: 0;   
            justify-content: flex-end ;
            display: flex;
            height: 595px;
        }
        .wrap-ul{
            width: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            top: 0;
            bottom: 0;
            left: 0;
            position: absolute;
            text-align: center;
            transition: .3s opacity;
            transform: translate3d(0, 0, 0);
        }
        .wrap-div{
            background: url(../img/hj_img/hotel/hotel_grang.jpg) no-repeat;
            position: absolute;
            min-width: 500px;
            height: 100%;
            left: 200px;
            top: 0;
        
        } 
    </style>
</head>
<body>
    <div class="wrap position-relative">
        <ul class="wrap-ul position-absolute">
            <li class="wrap-li position-relative">dddddd</li>
            <li class="wrap-li position-relative active">ddddddd</li> <!-- Active 된 li -->
            <li class="wrap-li position-relative">ddddd</li>
        </ul>
        <div class="wrap-div position-absolute"></div>
    </div>
</body>
</html>
