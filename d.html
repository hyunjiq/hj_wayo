<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="//cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <script src="//cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  
  
    <title>Document</title>
    <style>
        #section{
            height:500px;
            background: #ffa;
        }
        .wrap{
            height: 100%;
        }
        .text{
            border: 1px solid #000;
            height: 100%;
        }
        .mySwiper{
            height: 100%;
        }
        .swiperdiv{
            right: 0;
            height: 100%;
        }
        .swiper-slide{
            
            background-color: #faa;
            height: 100%;
        }
    </style>
</head>
<body>
    <section id="section" class="position-relative"> <!-- 1920 맨 바깥 -->
        <div class="container d-flex wrap"> <!-- 텍스트 위치 잡을곳 -->
            <div class="text col-3"> <!-- 텍스트 div -->
                adfdasfasdfadsfsdafsadfasdfdasf
            </div>
            <div class="swiperdiv col-7 position-absolute"> <!-- 스와이퍼 크기, 위치 잡는 div -->
                <div class="swiper mySwiper">
                    <div class="swiper-wrapper">
                      <div class="swiper-slide">Slide 1</div>
                      <div class="swiper-slide">Slide 2</div>
                      <div class="swiper-slide">Slide 3</div>
                      <div class="swiper-slide">Slide 4</div>
                      <div class="swiper-slide">Slide 5</div>
                      <div class="swiper-slide">Slide 6</div>
                      <div class="swiper-slide">Slide 7</div>
                      <div class="swiper-slide">Slide 8</div>
                      <div class="swiper-slide">Slide 9</div>
                    </div>
                    <div class="swiper-pagination"></div>
                  </div>
                  <script>
                    var swiper = new Swiper(".mySwiper", {
                      slidesPerView: 3,
                      spaceBetween: 30,
                      pagination: {
                        el: ".swiper-pagination",
                        clickable: true,
                      },
                    });
                  </script>
            </div>
        </div>
    </section>
</body>
</html>
